name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitize: ["", "thread", "address"]
    name: test ${{ matrix.sanitize || 'release' }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.sanitize && 'Debug' || 'Release' }} -DGS_SANITIZE=${{ matrix.sanitize }}
      - name: build
        run: cmake --build build -j
      - name: test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  netem:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iproute2 linux-modules-extra-$(uname -r) || true
      - run: sudo modprobe sch_netem || true
      - run: cmake -S . -B build -DGS_BUILD_TESTS=OFF && cmake --build build -j
      - name: 5% loss + jitter on loopback
        run: sudo scripts/netem.sh build

  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DGS_BUILD_TESTS=OFF && cmake --build build -j
      - run: nproc && lscpu | grep 'Model name'
      - name: loopback throughput / latency
        run: |
          for pps in 100000 250000 500000 750000; do
            ./build/gs_bench $pps 5 2 | tee -a bench.jsonl
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.jsonl
